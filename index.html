<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniSoundEditor</title>
<style>
  :root {
    --bg-color: #121212;
    --panel-bg: #1e1e1e;
    --text-color: #e0e0e0;
    --accent: #4CAF50;
    --accent-hover: #45a049;
    --border: #333;
  }
  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px;
    height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    margin-bottom: 20px;
  }
  h1 {
    margin: 0;
    font-size: 1.8rem;
    color: #fff;
  }
  .app-container {
    display: flex;
    gap: 20px;
    flex: 1;
    min-height: 0;
  }
  .editor-panel, .library-panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  .editor-panel {
    flex: 1;
    max-width: 650px;
  }
  .library-panel {
    flex: 1;
    overflow-y: auto;
  }
  textarea {
    width: 100%;
    background: #000;
    color: #00ff00;
    font-family: 'Courier New', Courier, monospace;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    resize: none;
    box-sizing: border-box;
    flex-grow: 1;
    margin-bottom: 15px;
  }
  .controls {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 15px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: background 0.2s;
  }
  button:hover {
    background: var(--accent-hover);
  }
  canvas {
    background: #000;
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 100%;
    height: 150px;
    display: block;
  }
  .category-title {
    margin-top: 25px;
    margin-bottom: 10px;
    font-size: 1.2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 5px;
    color: #fff;
  }
  .category-title:first-child {
    margin-top: 0;
  }
  .subcategory-title {
    margin: 10px 0;
    font-size: 1rem;
    color: #aaa;
    font-weight: bold;
  }
  .button-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .sound-btn {
    background: #333;
    font-size: 0.85rem;
    padding: 6px 12px;
    color: #ddd;
    font-weight: normal;
  }
  .sound-btn:hover {
    background: #555;
    color: #fff;
  }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-color); }
  ::-webkit-scrollbar-thumb { background: #555; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #777; }
</style>
</head>
<body>

<header>
  <h1>MiniSoundEditor</h1>
</header>

<div class="app-container">
  <div class="editor-panel">
    <textarea id="code" rows="20"></textarea>
    <div class="controls">
      <button id="playBtn">Play</button>
    </div>
    <canvas id="canvas" width="600" height="150"></canvas>
  </div>
  
  <div class="library-panel" id="library">
  </div>
</div>

for(i=96e3;i--;)b[i]=f(i)
s=A.createBufferSource()
s.buffer=m
s.connect(A.destination)
s.start()`;

const codeTextArea = document.getElementById("code");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const playBtn = document.getElementById("playBtn");
const libraryContainer = document.getElementById("library");

function loadAndPlay(soundCode, shouldPlay = true) {
  codeTextArea.value = "// Sound\n" + soundCode + "\n" + playerCode;
  if (shouldPlay) {
    playBtn.click();
  }
}

for (const [categoryTitle, categoryContent] of Object.entries(soundLibrary)) {
  
  const catHeader = document.createElement("div");
  catHeader.className = "category-title";
  catHeader.textContent = categoryTitle;
  libraryContainer.appendChild(catHeader);

  const firstValue = Object.values(categoryContent)[0];
  if (typeof firstValue === "string") {
    const btnGroup = document.createElement("div");
    btnGroup.className = "button-group";
    for (const [name, code] of Object.entries(categoryContent)) {
      const btn = document.createElement("button");
      btn.className = "sound-btn";
      btn.textContent = name;
      btn.onclick = () => loadAndPlay(code);
      btnGroup.appendChild(btn);
    }
    libraryContainer.appendChild(btnGroup);
  } else {
    for (const [subCategory, subContent] of Object.entries(categoryContent)) {
      const subHeader = document.createElement("div");
      subHeader.className = "subcategory-title";
      subHeader.textContent = subCategory + " :";
      libraryContainer.appendChild(subHeader);

      const btnGroup = document.createElement("div");
      btnGroup.className = "button-group";
      for (const [name, code] of Object.entries(subContent)) {
        const btn = document.createElement("button");
        btn.className = "sound-btn";
        btn.textContent = name;
        btn.onclick = () => loadAndPlay(code);
        btnGroup.appendChild(btn);
      }
      libraryContainer.appendChild(btnGroup);
    }
  }
}

playBtn.onclick = function() {
  eval(codeTextArea.value);
  draw();
};

function draw() {
  canvas.width ^= 0;
  ctx.strokeStyle = "#4CAF50"; 
  ctx.beginPath();
  ctx.moveTo(0, 75);
  
  if (typeof f !== "undefined") {
    for (let i = 96e3; i--;) {
      const val = f(i);
      if (val !== null) {
        ctx.lineTo(i / 100, val * 65 + 75);
      }
    }
  }
  ctx.stroke();
}

window.onload = function() {
  const defaultSound = Object.values(soundLibrary["Examples by Anders Kaare"])[0];
  loadAndPlay(defaultSound, false);
};
</script>
